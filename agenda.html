<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B0B0C"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Agenda Use Catholic</title>
</head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap">
<style>
/* Layout: cabeçalho enxuto + faixa financeira + uma tela por aba + barra inferior com botão central "Novo". Colunas lado a lado só em tela larga. */
:root{
  --bg:#0B0B0C; --surface:#151517; --surface2:#1E1E21; --line:#2B2B2F;
  --fg:#F5F3EE; --muted:#9C9BA2; --gold:#C8A24A; --gold-soft:rgba(200,162,74,.16);
  --btn-bg:#F5F3EE; --btn-fg:#0B0B0C;
  --amarelo:#E8B923;
  --fila:#8F8F98; --prod:#F08A24; --pronto:#3E8EF0; --entregue:#3FB36B; --atraso:#E5484D;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --r-sm:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6F5F2; --surface:#FFFFFF; --surface2:#EFEDE8; --line:#DDDAD2;
    --fg:#151517; --muted:#6A6970; --gold:#8C6A12; --gold-soft:rgba(140,106,18,.14);
    --btn-bg:#151517; --btn-fg:#F6F5F2;
    --amarelo:#B8860B; --fila:#6B6B73; --prod:#C46A0A; --pronto:#1F6FD1; --entregue:#1E8A4C; --atraso:#C8323A;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F6F5F2; --surface:#FFFFFF; --surface2:#EFEDE8; --line:#DDDAD2;
  --fg:#151517; --muted:#6A6970; --gold:#8C6A12; --gold-soft:rgba(140,106,18,.14);
  --btn-bg:#151517; --btn-fg:#F6F5F2;
  --amarelo:#B8860B; --fila:#6B6B73; --prod:#C46A0A; --pronto:#1F6FD1; --entregue:#1E8A4C; --atraso:#C8323A;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;font-variant-numeric:tabular-nums;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.hide,[hidden]{display:none!important}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.sub{font-size:19px;font-weight:600;line-height:1.2}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:20px;height:20px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;text-align:left;min-width:0}
.kpi small{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;line-height:1.25;min-height:2.5em}
.kpi b{display:block;font-size:14px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* abas do quadro */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.seg button{min-height:48px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.seg button b{font-size:15px;font-weight:600;color:var(--fg)}
.seg button[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c);color:var(--fg)}
.board{display:block}
.col{display:none}
.col.on{display:block}
.col-head{display:none}
.col-list{display:flex;flex-direction:column;gap:10px;min-height:60px}
@media (min-width:1100px){
  .seg{display:none}
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
  .col{display:block;background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .col-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .col.over{border-color:var(--gold)}
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}

/* cartão de pedido */
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--fila));border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.card.late{border-color:var(--atraso);border-left-color:var(--atraso);background:color-mix(in srgb,var(--atraso) 9%,var(--surface))}
.card.dragging{opacity:.45}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.num{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.nome{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.itens{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--fila)) 16%,transparent);color:var(--c,var(--fila));border:1px solid color-mix(in srgb,var(--c,var(--fila)) 35%,transparent);white-space:nowrap}
.chip.pago{--c:var(--entregue)} .chip.sinal{--c:var(--prod)} .chip.receber{--c:var(--atraso)} .chip.plain{--c:var(--muted)} .chip.late{--c:var(--atraso)}
.val{font-weight:600;font-size:15px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{min-width:0}
.btn{min-height:46px;padding:0 18px;border-radius:var(--r-sm);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn-bg);color:var(--btn-fg);flex:1}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--atraso);border:1px solid color-mix(in srgb,var(--atraso) 45%,transparent)}
.btn.sm{min-height:40px;font-size:13px;padding:0 12px;flex:0 0 auto}
.btn svg{width:18px;height:18px}
.mini{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.mini svg{width:16px;height:16px}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}

/* seções e painéis */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;min-width:0}
.panel h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.page-title{font-size:20px;font-weight:600;margin:4px 0 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big{font-size:24px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--entregue)} .delta.down{color:var(--atraso)} .delta.flat{color:var(--muted)}
.delta svg{width:13px;height:13px}
.nav-period{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav-period .t{font-weight:600;text-align:center;flex:1;min-width:0}
.fin-cols{display:grid;gap:14px}
@media (min-width:900px){.fin-cols{grid-template-columns:1fr 1fr;align-items:start}}

/* gráfico de barras */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent calc(33.33% - 1px),color-mix(in srgb,var(--line) 70%,transparent) calc(33.33% - 1px),color-mix(in srgb,var(--line) 70%,transparent) 33.33%)}
.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.bar i{display:block;width:100%;max-width:34px;border-radius:5px 5px 0 0;background:color-mix(in srgb,var(--fg) 30%,transparent);min-height:2px}
.bar.sel i{background:var(--gold)}
.bar em{font-style:normal;font-size:9.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.bar.sel em{color:var(--fg)}
.bar-labels{display:flex;gap:6px;margin-top:6px}
.bar-labels span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rank li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.rank .meter{grid-column:1/-1;height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.rank .meter i{display:block;height:100%;background:var(--gold)}

/* histórico */
.filters{display:grid;gap:8px;margin-bottom:12px}
@media (min-width:560px){.filters{grid-template-columns:2fr 1fr 1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;text-align:left;width:100%}
.hrow .r{text-align:right}

/* calendário */
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head span{text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 0}
.cell{min-height:54px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:6px 2px 4px;font-size:13px;font-weight:500;min-width:0}
.cell.out{opacity:.35}
.cell.today{border-color:var(--gold);color:var(--gold)}
.cell.busy{background:var(--gold-soft);border-color:var(--gold)}
.cell.sel{box-shadow:0 0 0 2px var(--fg)}
.cell .n{font-size:11px;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 5px;font-weight:600;background:var(--surface2);color:var(--fg)}
.cell .n.late{background:var(--atraso);color:#fff}
.cell .n.ok{background:var(--entregue);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin:10px 0 14px}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center}
.nav button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;letter-spacing:-.01em;color:var(--muted);font-weight:500;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"]::after{content:"";position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:var(--gold)}
.nav .plus{width:56px;height:56px;min-height:0;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);margin:-20px auto 0;box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--gold-soft)}
.nav .plus svg{width:26px;height:26px}
.nav .plus::after{display:none}

/* folhas (modais) */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow-y:auto;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:20px;max-height:90%}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-16px;background:var(--bg);padding:2px 0 6px;z-index:2}
.sheet-head h2{font-size:17px;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);min-width:0;font-size:16px}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
.opts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.opts button{min-height:46px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;padding:0 6px}
.opts button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);font-weight:600}
.item{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.group{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.group>h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--btn-bg);color:var(--btn-fg);padding:11px 18px;border-radius:99px;font-weight:500;z-index:60;max-width:calc(100% - 32px);text-align:center;font-size:13.5px}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}

/* camisas */
.strip.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.strip.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.strip.c2,.strip.c4{margin:0 0 12px}
.seg.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.s2 button,.seg.s3 button{min-height:44px;font-size:12px}
.seg.s2 button[aria-selected="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);font-weight:600}
.seg.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.s3 button{min-height:44px;font-size:12px}
.seg.s3 button[aria-selected="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);font-weight:600}
.cam-acts{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px;margin-bottom:12px}
.estq{margin-bottom:12px}
.estq>h3{font-size:14px;font-weight:600;margin-bottom:8px}
.grade{display:grid;grid-template-columns:64px repeat(var(--n,4),minmax(0,1fr));gap:6px 6px;align-items:start}
.gh{font-size:11px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.06em}
.gcor{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;min-height:44px;min-width:0}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--muted);flex:none}
.gcell{display:flex;flex-direction:column;gap:3px;min-width:0}
.qty{min-height:44px;padding:6px 2px;text-align:center;font-weight:600;font-size:16px;border-radius:var(--r-sm);-moz-appearance:textfield}
.qty::-webkit-outer-spin-button,.qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty.min{background:color-mix(in srgb,var(--amarelo) 22%,var(--surface));border-color:var(--amarelo)}
.qty.zero{background:color-mix(in srgb,var(--atraso) 14%,var(--surface));border-color:var(--atraso);color:var(--atraso)}
.qty.off{opacity:.45}
.na{display:grid;place-items:center;min-height:44px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-sm)}
.bd{font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--atraso);text-align:center;font-weight:600;line-height:1}
.bd.m{color:var(--amarelo)}
.mov{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.mov .d{font-weight:600;text-align:right}
.mov .pos{color:var(--entregue)}.mov .neg{color:var(--atraso)}
.mov small{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.vrow input{min-height:38px;padding:4px 6px;text-align:center;font-size:15px}
.vrow button{min-height:38px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500}
.vrow button[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.eaviso{font-size:12px;font-weight:500;color:var(--prod)}
.eok{font-size:12px;color:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div><div class="mark">Use Catholic</div><div class="sub" id="subtitle">Agenda de pedidos</div><div id="sync" style="font-size:11px;color:var(--muted)"></div></div>
      <button class="icon-btn" data-act="ajustes" aria-label="Ajustes e backup" id="b-aj"></button>
    </div>
    <div class="strip" id="strip"></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="Navegação"><div class="nav-in" id="nav"></div></nav>
<div id="layer"></div>
<script id="logic">
/* Regras puras: dinheiro, datas, financeiro, CSV, mensagem. Sem acesso à tela. */
var ETAPAS=['fila','producao','pronto','entregue'];
var NOME_ETAPA={fila:'Na fila',producao:'Em produção',pronto:'Pronto',entregue:'Entregue'};
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var MESES_CURTOS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function pad(n){return String(n).padStart(2,'0');}
function round2(n){return Math.round((+n||0)*100)/100;}
function uid(){return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmtNum(n){n=round2(n);var neg=n<0;var p=Math.abs(n).toFixed(2).split('.');return (neg?'-':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+p[1];}
function fmtBRL(n){return 'R$ '+fmtNum(n);}
function parseBRL(s){
  if(typeof s==='number')return round2(s);
  s=String(s==null?'':s).replace(/R\$|\s/g,'');
  if(!s)return 0;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var n=parseFloat(s);return isFinite(n)?round2(n):0;
}
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseISO(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function hojeISO(){return toISO(new Date());}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return toISO(d);}
function diffDias(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5);}
function brData(s){if(!s)return '—';var a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0];}
function brCurta(s){var a=s.split('-');return a[2]+'/'+a[1];}
function segundaDe(s){var d=parseISO(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return toISO(d);}
function primeiroDoMes(s){var d=parseISO(s);d.setDate(1);return toISO(d);}
function addMeses(s,n){var d=parseISO(s);d.setDate(1);d.setMonth(d.getMonth()+n);return toISO(d);}
function fimDoMes(s){var d=parseISO(s);return toISO(new Date(d.getFullYear(),d.getMonth()+1,0));}
function labelMes(s){var d=parseISO(s);var m=MESES[d.getMonth()];return m.charAt(0).toUpperCase()+m.slice(1)+' de '+d.getFullYear();}
function labelSemana(seg){return brCurta(seg)+' a '+brData(addDays(seg,6));}

function qtdCamisas(itens){return (itens||[]).reduce(function(a,i){return a+(i.tipo==='camisa'?(+i.qtd||0):0);},0);}
function subtotal(itens){
  var s=(itens||[]).reduce(function(a,i){return a+(i.tipo==='camisa'?0:(+i.qtd||0)*(+i.valor||0));},0);
  return round2(s+precoCamisas(qtdCamisas(itens)));
}
function pagoTotal(o){return round2((o.pagamentos||[]).reduce(function(a,p){return a+(+p.valor||0);},0));}
function restante(o){return Math.max(0,round2((+o.total||0)-pagoTotal(o)));}
function statusPgto(o){
  var t=+o.total||0,p=pagoTotal(o);
  if(t<=0.004)return 'pago';
  if(p<=0.004)return 'receber';
  return p>=t-0.005?'pago':'sinal';
}
function atrasado(o,hoje){return o.etapa!=='entregue'&&!!o.dataPrevista&&o.dataPrevista<hoje;}

function entrada(orders,ini,fim){
  var t=0;
  orders.forEach(function(o){(o.pagamentos||[]).forEach(function(p){if(p.data&&p.data>=ini&&p.data<=fim)t+=+p.valor||0;});});
  return round2(t);
}
function pedidosPeriodo(orders,ini,fim){return orders.filter(function(o){return o.dataPedido&&o.dataPedido>=ini&&o.dataPedido<=fim;});}
function aReceber(orders){return round2(orders.reduce(function(a,o){return a+restante(o);},0));}
function ticketMedio(list){return list.length?round2(list.reduce(function(a,o){return a+(+o.total||0);},0)/list.length):0;}
function variacao(cur,prev){
  if(prev<=0.004)return cur>0.004?{dir:'up',pct:null}:{dir:'flat',pct:0};
  var p=(cur-prev)/prev*100;
  return {dir:Math.abs(p)<0.05?'flat':(p>0?'up':'down'),pct:Math.abs(p)};
}
function topPecas(orders,ini,fim){
  var m={};
  function add(k,q,v){if(!m[k])m[k]={nome:k,qtd:0,valor:0};m[k].qtd+=q;m[k].valor+=v;}
  pedidosPeriodo(orders,ini,fim).forEach(function(o){
    var Q=qtdCamisas(o.itens),T=precoCamisas(Q);
    (o.itens||[]).forEach(function(i){
      if(i.tipo==='camisa'){var q=+i.qtd||0;add('Camisa '+i.estampa,q,Q?T*q/Q:0);return;}
      add(String(i.peca||'').trim()||'Sem nome',+i.qtd||0,(+i.qtd||0)*(+i.valor||0));
    });
  });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.qtd-a.qtd||b.valor-a.valor;}).slice(0,8);
}
function proximoNumero(orders){
  var max=0;
  orders.forEach(function(o){var m=/^UC(\d+)$/i.exec(String(o.numero||'').trim());if(m)max=Math.max(max,parseInt(m[1],10));});
  return 'UC'+String(max+1).padStart(5,'0');
}
function coluna(orders,etapa){
  var l=orders.filter(function(o){return o.etapa===etapa;});
  if(etapa==='entregue')return l.sort(function(a,b){return String(b.dataEntregaReal||b.dataPedido||'').localeCompare(String(a.dataEntregaReal||a.dataPedido||''));});
  return l.sort(function(a,b){return (a.ordem||0)-(b.ordem||0)||String(a.dataPrevista||'9').localeCompare(String(b.dataPrevista||'9'));});
}
function proximaOrdem(orders,etapa){return orders.filter(function(o){return o.etapa===etapa;}).reduce(function(m,o){return Math.max(m,o.ordem||0);},0)+1;}

function buildPagamentos(ex,f){
  var prev=(ex&&ex.pagamentos)||[],total=f.total;
  if(f.status==='receber')return [];
  if(f.status==='sinal'){
    if(prev.length===1)return [{data:f.dataPgto||prev[0].data,valor:f.sinal}];
    if(prev.length>1&&statusPgto(ex)==='sinal')return prev;
    return [{data:f.dataPgto,valor:f.sinal}];
  }
  var st=ex?statusPgto(ex):'receber';
  if(st==='sinal'){var rest=round2(total-pagoTotal(ex));return rest>0.004?prev.concat([{data:f.dataPgto,valor:rest}]):prev;}
  if(st==='pago'&&prev.length===1)return [{data:f.dataPgto||prev[0].data,valor:total}];
  if(st==='pago'&&prev.length>1){
    var s=pagoTotal(ex);if(Math.abs(s-total)<0.005)return prev;
    var last=prev[prev.length-1];
    return prev.slice(0,-1).concat([{data:last.data,valor:round2(last.valor+total-s)}]);
  }
  return [{data:f.dataPgto,valor:total}];
}
function normaliza(o){
  var r={};for(var k in o)r[k]=o[k];
  r.id=r.id||uid();r.numero=String(r.numero||'').trim();
  r.cliente=r.cliente||'';r.contato=r.contato||'';
  r.itens=Array.isArray(r.itens)?r.itens:[];r.pagamentos=Array.isArray(r.pagamentos)?r.pagamentos:[];
  r.desconto=round2(r.desconto);r.frete=round2(r.frete);r.total=round2(r.total);r.historico=Array.isArray(r.historico)?r.historico:[];
  r.parcelas=[1,2,3].indexOf(+r.parcelas)>=0?+r.parcelas:1;r.absorveTaxa=!!r.absorveTaxa;r.taxaCartao=round2(r.taxaCartao);r.taxaCusto=round2(r.taxaCusto);r.baixa=Array.isArray(r.baixa)?r.baixa:[];r.semBaixa=!!r.semBaixa;
  r.etapa=ETAPAS.indexOf(r.etapa)>=0?r.etapa:'fila';
  r.entrega=['retirada','local','envio'].indexOf(r.entrega)>=0?r.entrega:'retirada';
  r.formaPgto=r.formaPgto||'Pix';r.ordem=+r.ordem||0;
  ['dataPedido','dataPrevista','dataEntregaReal','endereco','obs'].forEach(function(k){r[k]=r[k]||'';});
  return r;
}
function nomeItem(i){return i.tipo==='camisa'?(i.estampa+' · '+i.cor+' · '+i.tam):(i.peca||'Peça');}
function textoItem(i){
  if(i.tipo==='camisa')return (i.qtd||1)+'x '+nomeItem(i);
  return (i.qtd||1)+'x '+(i.peca||'Peça')+(i.tamanho?' '+i.tamanho:'')+(i.embalagem?', com embalagem de presente':', sem embalagem');
}
function mensagemCliente(o,cfg){
  var nome=String(o.cliente||'').trim().split(/\s+/)[0]||'tudo bem';
  var L=['Olá, '+nome+'! Seu pedido '+o.numero+' na Use Catholic está confirmado.','','Itens:'];
  (o.itens||[]).forEach(function(i){
    if(i.tipo==='camisa')L.push('• '+textoItem(i));
    else L.push('• '+textoItem(i)+': '+fmtBRL((+i.qtd||0)*(+i.valor||0)));
  });
  var Qc=qtdCamisas(o.itens);if(Qc>0)L.push('Camisas ('+Qc+(Qc===1?' unidade':' unidades')+'): '+fmtBRL(precoCamisas(Qc)));
  if(o.desconto>0)L.push('Desconto: '+fmtBRL(o.desconto));
  if(o.frete>0)L.push('Frete: '+fmtBRL(o.frete));
  if(o.taxaCartao>0)L.push('Taxa do cartão ('+o.parcelas+'x): '+fmtBRL(o.taxaCartao));
  L.push('Total: '+fmtBRL(o.total),'');
  var st=statusPgto(o),pix=[];
  if(cfg&&cfg.pix){pix.push('Chave Pix: '+cfg.pix);if(cfg.recebedor)pix.push('Nome: '+cfg.recebedor);}
  if(st==='pago')L.push('Pagamento recebido. Obrigado!');
  else if(st==='sinal'){L.push('Sinal recebido: '+fmtBRL(pagoTotal(o))+'. Falta pagar: '+fmtBRL(restante(o))+'.');L=L.concat(pix);}
  else if(o.formaPgto==='Cartão')L.push('Pagamento no cartão de crédito em '+o.parcelas+'x, no valor de '+fmtBRL(o.total)+'.');
  else if(o.formaPgto==='Dinheiro')L.push('Pagamento em dinheiro, no valor de '+fmtBRL(o.total)+'.');
  else{L.push('Pagamento por Pix, no valor de '+fmtBRL(o.total)+'.');L=L.concat(pix);}
  L.push('');
  if(o.entrega==='retirada')L.push('Entrega: retirada, combinamos o horário por aqui.');
  else if(o.entrega==='local')L.push('Entrega em Campina Grande'+(o.endereco?': '+o.endereco:'.'));
  else L.push('Envio'+(o.endereco?' para: '+o.endereco:'.'));
  if(o.dataPrevista)L.push('Previsão: '+brData(o.dataPrevista));
  L.push('','Qualquer dúvida, é só chamar. Deus abençoe!');
  return L.join('\n');
}

function csvEsc(v){v=v==null?'':String(v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}

function parseCSV(t){
  t=String(t).replace(/^﻿/,'');
  var first=t.split(/\r?\n/)[0],d=first.split(';').length>=first.split(',').length?';':',';
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x!=='';});});
}

function semAcento(s){return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function crc16(str){
  var crc=0xFFFF;
  for(var i=0;i<str.length;i++){crc^=str.charCodeAt(i)<<8;for(var j=0;j<8;j++){crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xFFFF;}}
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function tlv(id,val){val=String(val);return id+String(val.length).padStart(2,'0')+val;}
function tipoChavePix(raw){
  var s=String(raw||'').trim(),dig=s.replace(/\D/g,'');
  if(s.indexOf('@')>=0)return 'email';
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s))return 'aleatoria';
  if(s.charAt(0)==='+'||(/[()\s]/.test(s)&&(dig.length===10||dig.length===11)))return 'celular';
  if(dig.length===14)return 'cnpj';
  if(dig.length===11)return 'cpf';
  return 'aleatoria';
}
function normalizaChavePix(raw,tipo){
  var s=String(raw||'').trim();if(!s)return '';
  if(!tipo||tipo==='auto')tipo=tipoChavePix(s);
  var dig=s.replace(/\D/g,'');
  if(tipo==='email')return s;
  if(tipo==='aleatoria')return s.toLowerCase();
  if(tipo==='cpf'||tipo==='cnpj')return dig;
  if(tipo==='celular'){if(s.charAt(0)==='+')return '+'+dig;if(dig.indexOf('55')===0&&dig.length>=12)return '+'+dig;return '+55'+dig;}
  return s;
}
function pixPayload(o){
  var chave=normalizaChavePix(o.chave,o.tipo);if(!chave)return '';
  var nome=semAcento(o.nome||'Use Catholic').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,25)||'USE CATHOLIC';
  var cidade=semAcento(o.cidade||'Campina Grande').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,15)||'CAMPINA GRANDE';
  var p=tlv('00','01')+tlv('01','11')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',chave))+tlv('52','0000')+tlv('53','986');
  if(o.valor>0)p+=tlv('54',(Math.round(o.valor*100)/100).toFixed(2));
  p+=tlv('58','BR')+tlv('59',nome)+tlv('60',cidade)+tlv('62',tlv('05','***'))+'6304';
  return p+crc16(p);
}

var PRECO_CAMISA={1:75,2:140,3:200};
var TAXAS_CARTAO={1:3.15,2:5.39,3:6.12};
function precoCamisas(q){
  q=Math.max(0,Math.floor(+q||0));var c=Math.floor(q/3),r=q%3;
  return round2(c*PRECO_CAMISA[3]+(r===1?PRECO_CAMISA[1]:r===2?PRECO_CAMISA[2]:0));
}
/* taxa repassada: total = valor ÷ (1 − taxa), arredondado para cima no centavo (conta em inteiros) */
function calcCartao(base,parcelas,absorve){
  var cents=Math.round((+base||0)*100),bp=Math.round((TAXAS_CARTAO[parcelas]||0)*100);
  if(absorve)return {total:cents/100,taxa:0,custo:Math.round(cents*bp/10000)/100};
  var num=cents*10000,den=10000-bp,q=Math.floor(num/den);if(q*den<num)q++;
  return {total:q/100,taxa:(q-cents)/100,custo:0};
}
function totalPedido(base,forma,parcelas,absorve){
  base=Math.max(0,round2(base));
  if(forma==='Cartão'&&base>0)return calcCartao(base,+parcelas||1,!!absorve);
  return {total:base,taxa:0,custo:0};
}

}

    b.onclick=function(){b.remove();};document.body.appendChild(b);}

window.addEventListener('error',function(e){mostraErroGlobal(e.message||'desconhecido');});
window.addEventListener('unhandledrejection',function(e){mostraErroGlobal((e.reason&&(e.reason.message||e.reason.code))||'falha');});
function comPrazo(pr,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej({code:'timeout'});},ms);pr.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
function msgErro(e){
  if(e&&e.code==='invalid_argument')return 'Sem permissão para salvar. Abra o link logado na sua conta.';
  if(e&&e.code==='timeout')return 'A gravação online não respondeu em 10 segundos.';
  return 'Não foi possível salvar'+(e&&(e.code||e.message)?' ('+(e.code||e.message)+')':'')+'. Tente de novo.';
}
function enfileira(fn,quieto){
  var p=chain.then(function(){return comPrazo(Promise.resolve().then(fn),10000);}).then(function(){return null;},function(e){return e||{code:'erro'};});
  chain=p;
  return p.then(function(e){if(e&&!quieto)toast(msgErro(e));return e;});
}
function salvarLocal(){lsSet(LS_KEY,JSON.stringify({orders:S.orders,cfg:S.cfg,cat:S.cat,vars:S.vars}));}
function achar(id){for(var i=0;i<S.orders.length;i++)if(S.orders[i].id===id)return S.orders[i];return null;}
function gravaPedido(o,quieto){
  var i=S.orders.findIndex(function(x){return x.id===o.id;});
  if(i>=0)S.orders[i]=o;else S.orders.push(o);
  enviaStatus(o);
  if(DB)return enfileira(function(){return DB.collection('orders').doc(o.id).set(plain(o));},quieto);
  salvarLocal();return Promise.resolve(null);
}
function apagaPedido(id){
  S.orders=S.orders.filter(function(x){return x.id!==id;});
  if(DB)enfileira(function(){return DB.collection('orders').doc(id).delete();});else salvarLocal();
}
function gravaCfg(quieto){
  if(DB)return enfileira(function(){return DB.doc('config/settings').set(plain(S.cfg));},quieto);
  salvarLocal();return Promise.resolve(null);
}
function gravaVar(v,quieto){
  S.vars[v.k]=v;
  if(DB)return enfileira(function(){return DB.collection('camisas').doc(v.k).set(plain(v));},quieto);

function gravaCat(quieto){

function mover(o,etapa,posicao){
  /* posicao: índice de destino na coluna (opcional); sem ele vai para o fim */
  var h=hojeISO(),n=Object.assign({},o);
  n.etapa=etapa;
  if(etapa==='entregue'&&!n.dataEntregaReal)n.dataEntregaReal=h;
  if(etapa!=='entregue'&&o.etapa==='entregue')n.dataEntregaReal='';
  var alvo=coluna(S.orders,etapa).filter(function(x){return x.id!==o.id;});
  var p=(posicao==null||posicao>alvo.length)?alvo.length:posicao;
  alvo.splice(p,0,n);
  alvo.forEach(function(x,k){var nv=k+1;if(x.id===n.id){n.ordem=nv;gravaPedido(n);}else if(x.ordem!==nv){gravaPedido(Object.assign({},x,{ordem:nv}));}});
}

function curto(v){return v>=1000?(v/1000).toFixed(1).replace('.',',')+'k':(v>0?String(Math.round(v)):'');}

function listaHist(){

function carregaFontes(){
  if(!document.fonts||!document.fonts.load)return Promise.resolve();
  var ps=[200,300,400,500,600,700,800].map(function(w){return document.fonts.load(w+' 32px Poppins','ãçéõÃÇÉ0123456789R$×·').catch(function(){});});
  return Promise.race([Promise.all(ps),new Promise(function(r){setTimeout(r,4000);})]);
}
function quebraTexto(ctx,s,max,font){
  ctx.font=font;
  var palavras=String(s).split(/\s+/).filter(Boolean),linhas=[],cur='';
  function empurra(w){
    if(ctx.measureText(w).width<=max){cur=w;return;}
    var parte='';
    for(var i=0;i<w.length;i++){
      if(ctx.measureText(parte+w[i]).width>max&&parte){linhas.push(parte);parte='';}
      parte+=w[i];
    }
    cur=parte;
  }
  palavras.forEach(function(w){
    var t=cur?cur+' '+w:w;
    if(!cur)empurra(w);
    else if(ctx.measureText(t).width<=max)cur=t;
    else{linhas.push(cur);cur='';empurra(w);}
  });
  if(cur)linhas.push(cur);
  return linhas.length?linhas:[''];
}
function textoEsp(ctx,s,x,y,font,cor,esp,alinha){
  ctx.font=font;ctx.fillStyle=cor;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  var cs=Array.from(s),ws=cs.map(function(c){return ctx.measureText(c).width;});
  var tot=ws.reduce(function(a,b){return a+b;},0)+esp*(cs.length-1),x0=alinha==='center'?x-tot/2:alinha==='right'?x-tot:x;
  cs.forEach(function(c,i){ctx.fillText(c,x0,y);x0+=ws[i]+esp;});
}
function T(ctx,s,x,y,font,cor,alinha){ctx.font=font;ctx.fillStyle=cor;ctx.textAlign=alinha||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* logo: ostensório em traço branco + "catholic" na vertical */
function desenhaLogoReserva(ctx,cx,y0){
  var mx=cx-30,my=y0+54;
  ctx.save();ctx.strokeStyle='#f3f3f0';ctx.fillStyle='#f3f3f0';ctx.lineCap='round';ctx.lineJoin='round';
  ctx.lineWidth=4;ctx.beginPath();ctx.arc(mx,my,21,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(mx,my,8,0,Math.PI*2);ctx.fill();
  for(var i=0;i<16;i++){
    var a=i*Math.PI/8,r1=29,r2=(i%4===0)?50:41;
    ctx.lineWidth=(i%4===0)?4:3;ctx.beginPath();ctx.moveTo(mx+Math.cos(a)*r1,my+Math.sin(a)*r1);ctx.lineTo(mx+Math.cos(a)*r2,my+Math.sin(a)*r2);ctx.stroke();
  }
  ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(mx,my+52);ctx.lineTo(mx,y0+128);ctx.stroke();
  ctx.beginPath();ctx.ellipse(mx,my+74,10,6,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(mx-30,y0+142);ctx.quadraticCurveTo(mx-18,y0+126,mx,y0+126);ctx.quadraticCurveTo(mx+18,y0+126,mx+30,y0+142);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.save();ctx.translate(cx+52,y0+82);ctx.rotate(-Math.PI/2);
  textoEsp(ctx,'catholic',0,10,fnt(200,34),'#f3f3f0',5,'center');
  ctx.restore();
}

function addEstampa(){
  var n=$('#n-est').value.trim().replace(/\s+/g,' ');
  if(!n)return erroCat('Digite o nome da estampa.');
  if(S.cat.estampas.some(function(e){return semAcento(e).toLowerCase()===semAcento(n).toLowerCase();}))return erroCat('Essa estampa já existe.');
  S.cat.estampas=S.cat.estampas.concat([n]);
  var l=[];S.cat.cores.forEach(function(c){c.tamanhos.forEach(function(t){l.push(novaVar(n,c.nome,t,S.cat.minPadrao));});});
  criaVariantes(l);gravaCat(true);render();sheetCatalogo();toast('Estampa adicionada: '+l.length+' variantes');
}
function addCor(){
  var n=$('#n-cor').value.trim().replace(/\s+/g,' '),ts=$('#n-cor-t').value.split(/[,;\s]+/).map(function(x){return x.trim().toUpperCase();}).filter(Boolean);
  ts=ts.filter(function(x,i){return ts.indexOf(x)===i;}).sort(ordenaTam);
  if(!n)return erroCat('Digite o nome da cor.');
  if(!ts.length)return erroCat('Informe os tamanhos dessa cor, separados por vírgula.');
  if(S.cat.cores.some(function(c){return semAcento(c.nome).toLowerCase()===semAcento(n).toLowerCase();}))return erroCat('Essa cor já existe.');
  S.cat.cores=S.cat.cores.concat([{nome:n,tamanhos:ts}]);
  var l=[];S.cat.estampas.forEach(function(e){ts.forEach(function(t){l.push(novaVar(e,n,t,S.cat.minPadrao));});});
  criaVariantes(l);gravaCat(true);render();sheetCatalogo();toast('Cor adicionada: '+l.length+' variantes');
}
function addTamanho(){
  var cn=$('#s-cor').value,t=$('#n-tam').value.trim().toUpperCase();
  if(!t)return erroCat('Digite o tamanho.');
  var c=S.cat.cores.find(function(x){return x.nome===cn;});if(!c)return;
  if(c.tamanhos.indexOf(t)>=0)return erroCat('A cor '+cn+' já tem o tamanho '+t+'.');
  c.tamanhos=c.tamanhos.concat([t]).sort(ordenaTam);
  var l=S.cat.estampas.map(function(e){return novaVar(e,cn,t,S.cat.minPadrao);});
  criaVariantes(l);gravaCat(true);render();sheetCatalogo();toast('Tamanho adicionado: '+l.length+' variantes');
}

document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v;
  if(a.indexOf('cam-')!==0)return;
  switch(a){

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='cam-fcor'){S.fCor=t.value;S.movN=60;render();return;}
  if(t.id==='cam-fest'){S.fEst=t.value;S.movN=60;render();return;}
  if(t.id==='cat-fcor'||t.id==='cat-fest'){if(t.id==='cat-fcor')S.fCor=t.value;else S.fEst=t.value;sheetCatalogo();render();return;}
  if(t.dataset&&t.dataset.cat){
    var c=S.cat,k=t.dataset.cat,val=parseBRL(t.value);
    c.precos=Object.assign({},c.precos);c.taxas=Object.assign({},c.taxas);
    if(k==='p1'||k==='p2'||k==='p3')c.precos[k.slice(1)]=Math.max(0,val);
    else if(k==='t1'||k==='t2'||k==='t3')c.taxas[k.slice(1)]=Math.min(50,Math.max(0,val));
    t.value=fmtNum(k[0]==='p'?c.precos[k.slice(1)]:c.taxas[k.slice(1)]);
    gravaCat(true);toast('Salvo');
  }
});

function recalc(){
  var q=0,s=0;
  F.itens.forEach(function(i){if(i.tipo==='camisa')q+=parseInt(i.qtd,10)||0;else s+=(parseInt(i.qtd,10)||0)*parseBRL(i.valor);});
  var cam=precoCamisas(q),sub=round2(s+cam),d=descReais(sub),base=Math.max(0,round2(sub-d+parseBRL(F.frete)));

    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){
      if(!r.ok||!j.access_token)throw {code:'login'};
      var n=sesGet()||{};n.a=j.access_token;n.r=j.refresh_token||n.r;n.e=j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600);sesSet(n);return n.a;});})
    .then(function(a){refP=null;return a;},function(e){refP=null;throw e;});
  return refP;
}
function papel(){var s=sesGet();try{var p=s.a.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';var j=JSON.parse(atob(p));return (j.app_metadata&&j.app_metadata.role)||'';}catch(e){return '';}}
function api(path,o,tent){
  o=o||{};
  return token(tent===1).then(function(t){
    var h={apikey:SBKEY,Authorization:'Bearer '+t,'Content-Type':'application/json'};if(o.h)for(var k in o.h)h[k]=o.h[k];
    return fetch(SBU+'/rest/v1/'+path,{method:o.m||'GET',headers:h,body:o.b!==undefined?JSON.stringify(o.b):undefined});
  }).then(function(r){
    if(r.status===401&&tent!==1)return api(path,o,1);
    return r.text().then(function(tx){var j=null;try{j=tx?JSON.parse(tx):null;}catch(e){}if(!r.ok)throw {code:'http_'+r.status,message:(j&&(j.message||j.msg))||''};return j;});
  });
}
function enc(s){return encodeURIComponent(s);}
/* mesmo formato do banco do Claude: doc(), collection().doc(), get/set/delete/onSnapshot */
var W={},pollT=null,pollBusy=false;
function snapDoc(id,data){return {id:id,exists:data!=null,data:function(){return data;}};}
function agendaPoll(){
  clearTimeout(pollT);pollT=null;
  var cols=Object.keys(W);if(!cols.length||pollBusy)return Promise.resolve();
  pollBusy=true;
  return Promise.all(cols.map(function(c){
    return api('agenda_docs?select=id,data&col=eq.'+enc(c)+'&order=id').then(function(rows){
      rows=rows||[];var w=W[c],sig=JSON.stringify(rows);
      if(sig===w.last)return;w.last=sig;
      var q={docs:rows.map(function(r){return snapDoc(r.id,r.data);}),metadata:{fromCache:false}};
      w.cbs.forEach(function(cb){try{cb(q);}catch(e){}});
      Object.keys(w.docs).forEach(function(id){var r=rows.filter(function(x){return x.id===id;})[0];w.docs[id].forEach(function(cb){try{cb(snapDoc(id,r?r.data:null));}catch(e){}});});
    },function(e){W[c].errs.forEach(function(cb){try{cb(e);}catch(x){}});W[c].errs=[];});
  })).then(function(){pollBusy=false;},function(){pollBusy=false;});
}
function watch(c){if(!W[c])W[c]={cbs:[],docs:{},errs:[],last:null};return W[c];}
function logo(){clearTimeout(pollT);pollT=setTimeout(agendaPoll,900);}
setInterval(function(){if(!document.hidden)agendaPoll();},15000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){agendaPoll();sincSite();}});
function refDoc(c,id){
  return {
    set:function(d){return api('agenda_docs?on_conflict=col,id',{m:'POST',b:{col:c,id:id,data:d},h:{Prefer:'resolution=merge-duplicates,return=minimal'}}).then(function(){logo();});},
    delete:function(){return api('agenda_docs?col=eq.'+enc(c)+'&id=eq.'+enc(id),{m:'DELETE',h:{Prefer:'return=minimal'}}).then(function(){logo();});},
    get:function(){return api('agenda_docs?select=data&col=eq.'+enc(c)+'&id=eq.'+enc(id)).then(function(r){return snapDoc(id,r&&r[0]?r[0].data:null);});},
    onSnapshot:function(cb){var w=watch(c);(w.docs[id]=w.docs[id]||[]).push(cb);w.last=null;logo();return function(){};}
  };
}
var DBS={
  doc:function(p){var a=p.split('/');return refDoc(a[0],a[1]);},
  collection:function(c){return {doc:function(id){return refDoc(c,id);},onSnapshot:function(cb,err){var w=watch(c);w.cbs.push(cb);if(err)w.errs.push(err);w.last=null;agendaPoll();return function(){};}};}
};
function lojaOk(){if(papel()!=='lookbook_admin')return Promise.resolve(false);return token().then(function(){return true;},function(){return false;});}
function telaLogin(){
  S.carregado=true;renderTopo();
  $('#nav').innerHTML='';
  $('#view').innerHTML='<div class="empty" style="margin-top:20px"><b>Entre com a conta da loja</b>A agenda fica guardada no banco do site e só abre com a conta da Use Catholic.<div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><a class="btn" style="flex:0 0 auto;text-decoration:none" href="/entrar">Entrar</a><a class="btn ghost" style="flex:0 0 auto;text-decoration:none" href="/">Ir para o site</a></div></div>';
  $('#sync').textContent='';
}
function baixa(nome,blob){
  try{var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);return true;}catch(e){return false;}
}

/* ===== Pedidos do site: entram sozinhos e o status volta para o cliente ===== */
var CNM={w:'Branca',k:'Preta',b:'Azul',m:'Marrom'},PAGOS={pago:1,em_producao:1,pronto:1,enviado:1,entregue:1};
function isoLocal(ts){var d=ts?new Date(ts):new Date();return toISO(d);}
function etapaDoSite(s){return s==='em_producao'?'producao':(s==='pronto'||s==='enviado')?'pronto':s==='entregue'?'entregue':'fila';}
function doSite(r){
  var itens=(r.items||[]).map(function(i){
    if(i.k==='camisa')return {tipo:'camisa',estampa:i.n||'',cor:CNM[i.c]||i.c||'',tam:i.s||'',qtd:+i.q||1,peca:'',tamanho:'',embalagem:false,valor:'',auto:false};
    return {tipo:'peca',peca:i.n||'',tamanho:i.s||'',qtd:+i.q||1,embalagem:false,valor:+i.p||0,auto:false,estampa:'',cor:'',tam:''};
  });
  var total=round2(+r.total||0),base=subtotal(itens),cartao=r.pay==='cartao',e=r.endereco||{};
  var end=e.rua?[e.rua+', '+(e.numero||'s/n')+(e.compl?' - '+e.compl:''),e.bairro,e.cidade,e.cep?'CEP '+e.cep:''].filter(Boolean).join(' · '):'';
  var etapa=etapaDoSite(r.status);
  return normaliza({
    id:'site-'+r.id,siteId:r.id,siteStatus:r.status,origem:'site',numero:r.num,cliente:r.cliente||'',contato:r.whatsapp||'',
    itens:itens,total:total,desconto:!cartao&&base>total?round2(base-total):0,frete:0,
    formaPgto:cartao?'Cartão':'Pix',parcelas:r.parcelas||1,taxaCartao:cartao&&total>base?round2(total-base):0,
    pagamentos:PAGOS[r.status]?[{data:isoLocal(r.pago_em||r.created_at),valor:total}]:[],
    etapa:etapa,ordem:proximaOrdem(S.orders,etapa),dataPedido:isoLocal(r.created_at),dataPrevista:'',
    entrega:/campina grande/i.test(e.cidade||'')?'local':'envio',endereco:end,
    obs:'Pedido feito no site.'+(e.obs?' Obs. do cliente: '+e.obs:'')
  });
}
function statusParaSite(o){
  if(o.etapa==='entregue')return 'entregue';
  if(o.etapa==='pronto')return 'pronto';
  if(o.etapa==='producao')return 'em_producao';
  return statusPgto(o)==='pago'?'pago':'aguardando_pagamento';
}
function enviaStatus(o){
  if(!o.siteId)return;
  var st=statusParaSite(o);if(st===o.siteStatus)return;
  o.siteStatus=st;
  var b={status:st};
  if(statusPgto(o)==='pago'){var pg=(o.pagamentos||[]).map(function(p){return p.data;}).filter(Boolean).sort().pop();b.pago_em=pg?new Date(pg+'T12:00:00').toISOString():new Date().toISOString();}else b.pago_em=null;
  if(st==='entregue')b.enviado_em=new Date().toISOString();
  api('orders?id=eq.'+enc(o.siteId),{m:'PATCH',b:b,h:{Prefer:'return=minimal'}}).catch(function(){toast('Não foi possível atualizar o status no site. Tente mover de novo.');});
}
var sincando=false;
function sincSite(){
  if(!DB||sincando)return;sincando=true;
  api('orders?select=*&na_agenda=eq.false&order=created_at.asc&limit=100').then(function(rows){
    var novos=0;
    return (rows||[]).reduce(function(p,r){return p.then(function(){
      var feito=function(){return api('orders?id=eq.'+enc(r.id),{m:'PATCH',b:{na_agenda:true},h:{Prefer:'return=minimal'}});};
      if(r.status==='cancelado'||achar('site-'+r.id))return feito();
      var o=doSite(r);
      return gravaPedido(o,true).then(function(er){if(er)throw er;novos++;return feito();});
    });},Promise.resolve()).then(function(){if(novos){render();toast(novos===1?'Chegou 1 pedido do site':'Chegaram '+novos+' pedidos do site');}});
  }).catch(function(){}).then(function(){sincando=false;});
}
setInterval(function(){if(!document.hidden)sincSite();},30000);

iniciar();
})();
